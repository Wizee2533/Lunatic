name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak proyek
        run: unzip -q GameBooster.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - name: Build APK
        working-directory: GameBooster
        run: gradle assembleDebug --no-daemon
      - name: Buat rilis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: GameBooster/app/build/outputs/apk/debug/app-debug.apk
